services:
  # Database PostgreSQL
  postgres:
    image: docker.io/library/postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-field_booking}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-field_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # Backend Go API Service
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${POSTGRES_USER:-postgres}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      DB_NAME: "${POSTGRES_DB:-field_booking}"
      DB_SSLMODE: "disable"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-field-booking}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-72}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/auth/google/callback}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # Frontend Next.js Service
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
    driver: local

networks:
  app_network:
    driver: bridge